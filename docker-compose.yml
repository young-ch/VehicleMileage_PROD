version: '3.8'

services:
  # 1. 웹 서버 (파이썬)
  web:                     # 👈 중복된 smu-jira-app: 줄은 지우고 web: 만 남깁니다.
    build: .
    container_name: smu-jira-app
    restart: always 
    ports:
      - "8885:5000"
    depends_on:
      - db
    env_file:              # 👈 여기에 위치해야 합니다. (띄어쓰기 칸 수 맞추기)
      - .env
    environment:
      - TZ=Asia/Seoul

  # 2. 데이터베이스 (MariaDB)
  db:
    image: mariadb:10.11
    container_name: smu-jira-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my_strong_root_password
      MYSQL_DATABASE: smu_jira
      MYSQL_USER: smu_admin
      MYSQL_PASSWORD: smu2600
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:            # 👈 맨 밑에는 이것만 깔끔하게 남겨주세요.

